<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <title>AgroTrack — Registrar Abastecimento</title>
    <meta charset="UTF-8">
    <meta name="description" content="AgroTrack — Registrar abastecimento da frota.">
    <link rel="icon" type="image/png" th:href="@{/icon.png}">
    <th:block th:replace="~{fragments/layout :: head-content}"></th:block>
</head>
<body>
<div class="at-sidebar-overlay" id="sidebarOverlay"></div>
<div class="at-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="at-main">
        <div th:replace="~{fragments/layout :: topbar('Abastecimentos')}"></div>
        <main class="at-content" id="main-content">
            <div class="at-page-header fade-in">
                <h1 class="at-page-title">Registrar Abastecimento</h1>
                <p class="at-page-subtitle">Lance o abastecimento de combustível para manter o controle de consumo e gastos da frota.</p>
            </div>

            <div th:if="${errorMessage}" class="at-alert at-alert-danger" role="alert">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${errorMessage}">Erro.</span>
            </div>
            <div th:if="${mensagemSucesso}" class="at-alert at-alert-success" role="alert">
                <i class="bi bi-check-circle"></i> <span th:text="${mensagemSucesso}">Sucesso.</span>
            </div>

            <div class="at-card fade-in delay-1" style="max-width: 800px; margin: 0 auto;">
                <div class="at-card-header">
                    <h2 class="at-card-title">Dados do Abastecimento</h2>
                </div>
                <div class="at-card-body">
                    <form th:action="@{/abastecimentos}" method="post">
                        <div class="at-form-group">
                            <label class="at-form-label" for="idMaquina">Máquina <span class="required">*</span></label>
                            <select id="idMaquina" name="idMaquina" class="at-form-control at-form-select" required onchange="onMaquinaChange(this)">
                                <option value="">Selecione a máquina...</option>
                                <option th:each="m : ${maquinas}" th:value="${m.id}"
                                        th:text="${m.nome} + ' (' + ${m.marca} + ' ' + ${m.modelo} + ')'"
                                        th:attr="data-hodometro=${m.hodometroInicial}"></option>
                            </select>
                        </div>

                        <div class="at-grid at-grid-2">
                            <div class="at-form-group">
                                <label class="at-form-label" for="dataAbastecimento">Data e Hora</label>
                                <input type="datetime-local" id="dataAbastecimento" name="dataAbastecimento" class="at-form-control">
                                <span class="at-form-hint">Deixe em branco para usar a data/hora atual.</span>
                            </div>
                            <div class="at-form-group">
                                <label class="at-form-label" for="tipoCombustivel">Combustível <span class="required">*</span></label>
                                <select id="tipoCombustivel" name="tipoCombustivel" class="at-form-control at-form-select" required>
                                    <option value="">Selecione a máquina primeiro</option>
                                </select>
                            </div>
                        </div>

                        <div class="at-grid at-grid-2">
                            <div class="at-form-group">
                                <label class="at-form-label" for="litros">Litros <span class="required">*</span></label>
                                <input type="number" step="0.01" min="0.1" id="litros" name="litros" class="at-form-control" placeholder="Ex: 150.5" required>
                            </div>
                            <div class="at-form-group">
                                <label class="at-form-label" for="hodometroAtual">Hodômetro / Horímetro Atual <span class="required">*</span></label>
                                <input type="number" step="0.1" min="0" id="hodometroAtual" name="hodometroAtual" class="at-form-control" placeholder="Ex: 1250.5" required>
                                <span class="at-form-hint" id="hodometro-hint"></span>
                            </div>
                        </div>

                        <div class="at-form-actions">
                            <button type="submit" class="btn btn-primary btn-lg btn-block">Registrar Abastecimento</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script>
    function onMaquinaChange(selectEl) {
        const idMaquina = selectEl.value;
        const selectComb = document.getElementById('tipoCombustivel');
        const hodInput = document.getElementById('hodometroAtual');
        const hint = document.getElementById('hodometro-hint');

        selectComb.innerHTML = '<option value="">Carregando...</option>';
        selectComb.disabled = true;

        if (!idMaquina) {
            selectComb.innerHTML = '<option value="">Selecione a máquina primeiro</option>';
            hodInput.min = '0';
            hodInput.placeholder = 'Ex: 1250.5';
            hint.textContent = '';
            return;
        }

        const opt = selectEl.selectedOptions[0];
        const hodMin = parseFloat(opt.dataset.hodometro) || 0;
        hodInput.min = hodMin;
        hodInput.placeholder = 'Mínimo: ' + hodMin;
        hint.textContent = 'Hodômetro atual registrado: ' + hodMin + ' h/km';

        fetch('/api/maquinas/' + idMaquina + '/combustiveis')
            .then(r => r.json())
            .then(tipos => {
                selectComb.innerHTML = '';
                const lista = (tipos && tipos.length > 0) ? tipos : ['Diesel S10', 'Diesel S500', 'Gasolina', 'Etanol'];
                lista.forEach(t => {
                    const o = document.createElement('option');
                    o.value = t;
                    o.textContent = t;
                    selectComb.appendChild(o);
                });
                selectComb.disabled = tipos && tipos.length === 1;
                if (tipos && tipos.length === 1) selectComb.title = 'Esta máquina aceita apenas ' + tipos[0];
                else selectComb.title = '';
            })
            .catch(() => {
                selectComb.innerHTML = '<option value="Diesel S10">Diesel S10</option><option value="Diesel S500">Diesel S500</option><option value="Gasolina">Gasolina</option><option value="Etanol">Etanol</option>';
                selectComb.disabled = false;
            });
    }
</script>
</body>
</html>
