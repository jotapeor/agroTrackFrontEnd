<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <title>AgroTrack — Máquinas Arquivadas</title>
    <meta charset="UTF-8">
    <meta name="description" content="AgroTrack — Máquinas arquivadas.">
    <link rel="icon" type="image/png" th:href="@{/icon.png}">
    <th:block th:replace="~{fragments/layout :: head-content}"></th:block>
    <style>
        .machine-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:16px; }
        .machine-card { background:var(--at-surface); border:1px solid var(--at-border); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(148, 163, 184, 0.08); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease; display:flex; flex-direction:column; opacity: 0.85; }
        .machine-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(148, 163, 184, 0.12); opacity: 1; }
        .machine-card-photo { width:100%; height:160px; object-fit:cover; background:#f0fdf4; display:flex; align-items:center; justify-content:center; color:var(--at-text-muted); font-size:3rem; border-bottom:1px solid var(--at-border); filter: grayscale(40%); }
        .machine-card-photo img { width:100%; height:100%; object-fit:cover; }
        .machine-card-body { padding:14px; flex:1; display:flex; flex-direction:column; }
        .machine-card-name { font-size:.95rem; font-weight:700; color:var(--at-text); margin-bottom:2px; }
        .machine-card-detail { font-size:.8rem; color:var(--at-text-secondary); margin-bottom:2px; }
        .machine-card-tags { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
        .machine-card-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:10px; border-top:1px solid var(--at-border); }
        .empty-state { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--at-text-muted); }
        .empty-state i { font-size:3rem; display:block; margin-bottom:12px; }
    </style>
</head>
<body>
<div class="at-sidebar-overlay" id="sidebarOverlay"></div>
<div class="at-wrapper">
    <div th:replace="~{fragments/layout :: sidebar}"></div>
    <div class="at-main">
        <div th:replace="~{fragments/layout :: topbar('Máquinas Arquivadas')}"></div>
        <main class="at-content" id="main-content">
            <div class="at-page-header fade-in" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
                <div>
                    <h1 class="at-page-title">Máquinas Arquivadas</h1>
                    <p class="at-page-subtitle" th:text="${#lists.size(maquinas) + ' máquina(s) arquivada(s).'}">0 máquinas.</p>
                </div>
                <a th:href="@{/maquinas}" class="btn btn-outline">
                    <i class="bi bi-arrow-left"></i> Voltar para Máquinas Ativas
                </a>
            </div>

            <div th:if="${mensagemSucesso}" class="at-alert at-alert-success" role="alert">
                <i class="bi bi-check-circle"></i> <span th:text="${mensagemSucesso}">Sucesso.</span>
            </div>
            <div th:if="${errorMessage}" class="at-alert at-alert-danger" role="alert">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${errorMessage}">Erro.</span>
            </div>

            <div class="machine-grid">
                <div class="machine-card fade-in" th:each="m, iterStat : ${maquinas}" th:if="${!#lists.isEmpty(maquinas)}" th:style="'animation-delay: ' + ${#numbers.formatDecimal(iterStat.index * 0.05, 1, 2, 'POINT')} + 's'">
                    <div class="machine-card-photo">
                        <img th:if="${m.fotoPath}" th:src="'http://localhost:8080/uploads/maquinas/' + ${m.fotoPath}" alt="Foto" />
                        <i th:unless="${m.fotoPath}" class="bi bi-truck"></i>
                    </div>
                    <div class="machine-card-body">
                        <div class="machine-card-name" th:text="${m.nome}">Nome</div>
                        <div class="machine-card-detail" th:text="${m.marca != null && !m.marca.isEmpty() ? m.marca + ' ' + m.modelo : m.modelo}">Modelo</div>
                        <div class="machine-card-detail" th:text="'Ano ' + ${m.ano} + ' · ' + ${m.tipo}">Tipo</div>
                        <div class="machine-card-detail" th:text="${m.nomeFazenda != null ? '📍 ' + m.nomeFazenda : ''}">Fazenda</div>

                        <div class="machine-card-tags">
                            <span class="at-badge at-badge-neutral">Arquivada</span>
                            <span class="at-badge" th:classappend="${m.nivelRisco == 'Baixo' ? 'at-badge-success' : (m.nivelRisco == 'Medio' ? 'at-badge-warning' : 'at-badge-danger')}" th:text="${m.nivelRisco}">Risco</span>
                        </div>

                        <div class="machine-card-actions">
                            <form th:action="@{/maquinas/{id}/reativar(id=${m.id})}" method="post" style="flex:1;">
                                <button type="submit" class="btn btn-primary btn-sm" style="width:100%;">
                                    <i class="bi bi-arrow-counterclockwise"></i> Reativar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="empty-state" th:if="${#lists.isEmpty(maquinas)}">
                    <i class="bi bi-archive"></i>
                    <div style="font-size:1rem; font-weight:600;">Nenhuma máquina arquivada</div>
                    <p style="margin-top:4px;">As máquinas arquivadas aparecem aqui.</p>
                </div>
            </div>
        </main>
        <div th:replace="~{fragments/layout :: footer}"></div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
